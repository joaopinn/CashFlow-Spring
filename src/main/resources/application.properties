spring.application.name=demo
spring.config.import=optional:file:./config/database-local.properties

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=30000

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
# Habilite quando a primeira migration estiver pronta.
spring.flyway.enabled=${FLYWAY_ENABLED:false}

# Obrigatório: Base64 de ao menos 32 bytes aleatórios. Não há segredo padrão.
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER:cashflow}
app.jwt.audience=${JWT_AUDIENCE:cashflow-api}
app.jwt.ttl-seconds=${JWT_TTL_SECONDS:900}
spring.data.web.pageable.max-page-size=100
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
springdoc.swagger-ui.persist-authorization=false
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
